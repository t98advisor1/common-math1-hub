:root{--ink:#251f21;--muted:#585254;--teal:#377566;--pale:#edf5f2;--line:#eae9ea;--red:#b51f2b;--sand:#f4efec}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:18px/1.65 CMKorean,Arial,'Noto Sans KR','Malgun Gothic',sans-serif;background:#fff}button,input,select{font:inherit}button{min-height:46px;padding:9px 15px;cursor:pointer;border:1px solid #b8c6c1;border-radius:7px;background:white;color:var(--ink)}button:hover{background:var(--pale)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}button:disabled{color:#777;cursor:not-allowed;background:#eee;border-color:#ddd}.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.primary:hover{background:#285a4e}.wrap{max-width:1120px;margin:auto;padding:24px 30px}header{border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{font-size:14px;color:var(--muted);letter-spacing:.04em}h1{font-size:30px;letter-spacing:-.04em;line-height:1.3;margin:8px 0 10px}h2{font-size:25px;letter-spacing:-.025em;line-height:1.4;margin:0 0 14px}h3{font-size:19px;margin:18px 0 8px}p{margin:10px 0}.muted,small{color:var(--muted);font-size:15px}.chip{display:inline-block;background:var(--sand);padding:3px 10px;font-size:14px;border-radius:4px}.progress{display:flex;gap:5px;margin:18px 0}.progress i{flex:1;height:5px;background:var(--line)}.progress i.done{background:var(--teal)}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;margin-top:24px}.panel{min-width:0}.chartbox{border:1px solid var(--line);border-radius:10px;padding:12px}.chartbox svg{display:block;width:100%;height:auto}#legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}#legend b{font-weight:600}.dot{display:inline-block;width:22px;border-top:3px solid;vertical-align:middle;margin-right:6px}.controls{display:grid;gap:8px;margin-top:14px}label{display:block}input[type=range]{width:100%;min-height:44px;accent-color:var(--teal);margin:0}select,input[type=number]{border:1px solid #a5ada9;border-radius:5px;padding:8px;min-height:44px;max-width:100%;background:white;color:var(--ink)}select{width:100%}.readout{background:var(--pale);padding:12px 14px;border-radius:6px;margin:12px 0;overflow-wrap:anywhere}.equation{font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.8;overflow-wrap:anywhereoverflow-x:auto;}.choice{display:grid;gap:9px;margin:18px 0}.choice button{text-align:left}.notice{background:var(--sand);padding:12px 14px;border-radius:6px;font-size:15px}.status{min-height:32px;margin:12px 0;font-size:16px;color:var(--teal);font-weight:600}.status.error{color:var(--red)}nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:28px}.answer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.answer-grid label{font-size:14px;text-align:center}.answer-grid input{width:100%;text-align:center}.hint{border-left:3px solid var(--teal);padding:8px 12px;background:var(--pale);font-size:16px;margin:10px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.term-pool{display:flex;gap:7px;flex-wrap:wrap;padding:12px 0}.term{background:#f3f6f5;padding:8px 12px;min-height:45px}.term.selected{outline:3px solid var(--teal)}.term.used{opacity:.4;pointer-events:none}.bins{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bin{min-height:100px;padding:12px;text-align:left;background:#fff;border:1px dashed #84998f}.bin strong{display:block}.bin span{display:block;font-size:15px;min-height:25px}.formula{padding:14px;border:1px solid var(--line);border-radius:8px;margin:12px 0}.summary{display:grid;gap:8px}.summary p{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0;margin:0}.footer{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;font-size:13px;color:var(--muted)}a{color:var(--teal);overflow-wrap:anywhere}.visuallyhidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){body{font-size:17px}.wrap{padding:18px 16px}.layout{grid-template-columns:1fr;gap:22px;margin-top:18px}h1{font-size:26px}h2{font-size:23px}.equation{font-size:21px}.chartbox{padding:8px}.answer-grid{gap:5px}.answer-grid input{padding:8px 2px}.bins{gap:7px}.bin{padding:10px}.graph-panel{order:1}.activity-panel{order:2}nav{position:static}.term{padding:8px 10px}}

</style></head><body><main class="wrap"><header><div class="eyebrow">공통수학1 · 48차시 계획 중 01</div><h1>다항식의 덧셈과 뺄셈</h1><span class="chip">학생용 실습 앱 · 공통수학1 학습관</span><div class="progress" aria-hidden="true" id="progress"></div><div id="stageLabel" class="muted"></div></header><div class="layout"><section class="panel graph-panel" aria-label="조작 그래프"><div class="chartbox"><div id="legend"></div><svg id="graph" viewBox="0 0 520 340" role="img" aria-labelledby="chartTitle chartDesc"></svg><div id="graphText" class="muted"></div></div><div class="controls"><label for="xslider">관찰할 x: <strong id="xvalue">1</strong></label><input id="xslider" type="range" min="-3" max="3" value="1" step="0.1"><div class="muted">슬라이더를 움직이면 그래프 위의 점과 함숫값이 바로 바뀝니다.</div></div><div class="readout" id="equations"></div><div id="graphNote" class="notice"></div></section><section class="panel activity-panel" aria-labelledby="activityTitle"><div id="activity"></div><div id="message" class="status" aria-live="polite"></div></section></div><nav><button id="back">이전</button><button class="primary" id="next">다음</button></nav><footer class="footer">공통수학1 학습관의 차시 학습 앱입니다. 학생 이름·학번을 묻지 않으며, 응답을 외부로 전송하거나 기기에 저장하지 않습니다. 새로고침하면 처음으로 돌아갑니다.</footer></main><script>
'use strict';
const BASE_A=[-1,2,0,3], BASE_B=[1,-1,-1,2];
const state={stage:0,selK:2,ok:[false,false,false,false,false,false,false],a:BASE_A.slice(),b:BASE_B.slice(),op:'sub',x:1,moved:new Set(),prediction:null,hints:0,attempts:0,challengeAttempts:0,challengeHints:0,textbookHelp:false,challengeHelp:false,selected:null,grouped:{},groupOp:'sub',start:Date.now()};
const labels=['예측하기','계수 직접 조작','동류항 묶기','교과서 문제','도전과 변형','개념 정리','마치기'];
const $=id=>document.getElementById(id);
let mjxN=0,mjxQ=Promise.resolve();function mjxAll(){if(window.MathJax&&MathJax.typesetPromise){mjxQ=mjxQ.then(function(){return MathJax.typesetPromise().catch(function(){});});}else if(mjxN<100){mjxN++;setTimeout(mjxAll,400);}}const ev=(a,x)=>a.reduceRight((r,c)=>r*x+c,0);const result=()=>state.a.map((v,i)=>v+(state.op==='add'?1:-1)*state.b[i]);
function nice(n){return Math.abs(n)<1e-9?'0':Number(n.toFixed(3)).toString()}
function format(a,hl=-1){let s='';for(let i=a.length-1;i>=0;i--){let c=a[i];if(Math.abs(c)<1e-9)continue;let vp=i===0?'':i===1?'x':'x^{'+i+'}';if(i===hl){s+=(s?(c<0?'':'+'):'')+'\\class{hlj}{'+(c<0?'-':'')+nice(Math.abs(c))+'}'+vp;continue;}let term=(i===0||Math.abs(c)!==1?nice(Math.abs(c)):'')+vp;s+=(s?(c<0?'-':'+'):(c<0?'-':''))+term;}return s||'0'}
function message(t,error=false){$('message').innerHTML=t;$('message').className='status'+(error?' error':'');mjxAll();}
function graph(){let hl=(state.stage===1?state.selK:-1);let reveal=(state.stage===3?state.ok[3]:state.stage===4?state.ok[4]:state.stage>0||state.prediction!==null);let an=state.stage===4?'C':'A',bn=state.stage===4?'(D+E)':'B',rn=an+(state.op==='add'?'+':'-')+bn;let lines=[{name:an,a:state.a,color:'#585254',dash:''},{name:bn,a:state.b,color:'#86705c',dash:'7 4'}];if(reveal)lines.push({name:rn,a:result(),color:'#377566',dash:''});let yMax=1;for(let l of lines)for(let x=-3;x<=3.001;x+=.05)yMax=Math.max(yMax,Math.abs(ev(l.a,x)));yMax=Math.ceil(yMax/10)*10;const X=x=>48+(x+3)/6*450,Y=y=>302-(y+yMax)/(2*yMax)*280;let s='<title id="chartTitle">다항식 그래프</title><desc id="chartDesc">x는 -3부터 3까지. A와 B, 예측 후에는 계산 결과 곡선을 표시합니다.</desc><defs><clipPath id="clip"><rect x="48" y="22" width="450" height="280"/></clipPath></defs>';for(let v=-3;v<=3;v++){s+=`<path d="M${X(v)} 22 V302" stroke="#eae9ea"/><text x="${X(v)}" y="322" font-size="13" text-anchor="middle">${v}</text>`;}for(let v of [-yMax,-yMax/2,0,yMax/2,yMax])s+=`<path d="M48 ${Y(v)} H498" stroke="#eae9ea"/><text x="42" y="${Y(v)+4}" font-size="12" text-anchor="end">${nice(v)}</text>`;s+=`<path d="M48 ${Y(0)} H498 M${X(0)} 22 V302" stroke="#938c8f"/><text x="505" y="${Y(0)-5}" font-size="14">x</text><text x="${X(0)+6}" y="18" font-size="14">y</text><g clip-path="url(#clip)">`;for(let l of lines){let d='';for(let i=0;i<=240;i++){let x=-3+i/40;d+=(i?'L':'M')+X(x).toFixed(2)+' '+Y(ev(l.a,x)).toFixed(2)+' ';}s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.name==='A'||l.name==='B'?2:3.5}" stroke-dasharray="${l.dash}"/><circle cx="${X(state.x)}" cy="${Y(ev(l.a,state.x))}" r="5" fill="${l.color}" stroke="white"/>`;}s+=`<path d="M${X(state.x)} 22 V302" stroke="#938c8f" stroke-dasharray="3 5"/></g>`;$('graph').innerHTML=s;$('legend').innerHTML=lines.map(l=>`<b style="color:${l.color}"><i class="dot" style="border-color:${l.color}"></i>${l.name}</b>`).join('');$('graphText').innerHTML=`\\(x=${nice(state.x)}\\)일 때 `+lines.map(l=>'\\('+l.name+'='+nice(ev(l.a,state.x))+'\\)').join(' / ');$('xvalue').textContent=nice(state.x);$('equations').innerHTML=`<div class="equation">\\(${an}=${format(state.a,hl)}\\)<br>\\(${bn}=${format(state.b,hl)}\\)${reveal?'<br><b>\\('+rn+'='+format(result(),hl)+'\\)</b>':''}</div>`;mjxAll();$('graphNote').textContent='좌표 눈금은 표시된 범위에 맞춰 자동 조절됩니다. 몇 개의 x값에서 결과가 맞는 것만으로 두 다항식이 항상 같다고 증명할 수는 없습니다. 동류항의 계수도 비교하세요.';}
function answerFields(prefix){return `<div class="answer-grid">${[3,2,1,0].map(d=>`<label>${d===0?'상수항':d===1?'\\(x\\)의 계수':d===2?'\\(x^{2}\\)의 계수':'\\(x^{3}\\)의 계수'}<input id="${prefix}${d}" type="number" step="any" inputmode="decimal" aria-label="${prefix==='sum'?'A더하기B':prefix==='diff'?'A빼기B':'답'} ${d}차항 계수"></label>`).join('')}</div>`;}
function values(prefix){return [0,1,2,3].map(i=>{let v=$(prefix+i).value;return v.trim()===''?NaN:Number(v)})}function same(a,b){return a.every((v,i)=>Number.isFinite(v)&&Math.abs(v-b[i])<1e-8)}
function resetBase(){state.a=BASE_A.slice();state.b=BASE_B.slice();state.op='sub';graph();}
function render(){let i=state.stage;$('stageLabel').textContent=`${i+1} / ${labels.length} · ${labels[i]}`;$('progress').innerHTML=labels.map((_,n)=>`<i class="${n<=i?'done':''}"></i>`).join('');$('back').disabled=i===0;$('next').disabled=!state.ok[i]||i===6;$('next').textContent=i===5?'학습 요약 보기':'다음';message('');let h='';
if(i===0){h=`<h2 id="activityTitle">빼는 식의 부호는 어떻게 될까요?</h2><p>두 다항식을 빼기 전에, 결과의 \\(x^{2}\\)의 계수를 예측해 보세요.</p><div class="equation">\\(A=3x^{3}+2x-1\\)<br>\\(B=2x^{3}-x^{2}-x+1\\)</div><p><strong>\\(A-B\\)의 \\(x^{2}\\)의 계수</strong>는 무엇일까요?</p><div class="choice"><button data-pred="-1">−1</button><button data-pred="1">1</button><button data-pred="0">0</button></div><p class="muted">예측을 고른 뒤 그래프와 동류항을 이용해 확인합니다. 틀려도 괜찮습니다.</p>`;}
if(i===1){h=`<h2 id="activityTitle">계수를 바꾸고 곡선을 비교하세요</h2><p>같은 차수의 항을 선택한 뒤 A와 B의 계수를 각각 움직여 보세요.</p><label for="degree">비교할 항</label><select id="degree"><option value="2">2차항의 계수</option><option value="3">3차항의 계수</option><option value="1">1차항의 계수</option><option value="0">상수항</option></select><p class="muted">지금 비교하는 항은 왼쪽 식에서 형광펜으로 표시됩니다.</p><div class="controls"><label for="aCoef">A의 계수: <b id="aval">${state.a[2]}</b></label><input id="aCoef" type="range" min="-5" max="5" step="1" value="${state.a[2]}"><label for="bCoef">B의 계수: <b id="bval">${state.b[2]}</b></label><input id="bCoef" type="range" min="-5" max="5" step="1" value="${state.b[2]}"></div><label for="operation">연산</label><select id="operation"><option value="sub">빼기</option><option value="add">더하기</option></select><div id="coefRelation" class="readout"></div><p class="muted">A와 B의 계수 슬라이더를 각각 한 번 이상 움직이면 다음으로 갈 수 있습니다.</p><button id="restore">교과서 식으로 되돌리기</button>`;}
if(i===2){resetBase();h=`<h2 id="activityTitle">동류항끼리 묶어 보세요</h2><p>\\(A-B\\)를 계산합니다. <strong>\\(-B\\)의 모든 항</strong>은 이미 부호를 바꿨습니다. 카드를 같은 차수의 칸에 옮기세요.</p><p class="muted">마우스: 끌어 놓기. 휴대폰·키보드: 카드 선택 후 같은 차수의 칸 누르기.</p><div class="term-pool" id="pool"></div><div class="bins" id="bins"></div><div class="readout" id="groupResult">아직 묶지 않은 카드를 옮겨 보세요.</div><button id="resetGroup">카드 다시 놓기</button>`;}
if(i===3){resetBase();h=`<h2 id="activityTitle">교과서 문제를 풀어 보세요</h2><p class="muted">공통수학1 · 13쪽 문제 2⑴</p><p>다음 두 다항식 \\(A\\)와 \\(B\\)에 대하여 \\(A+B\\)와 \\(A-B\\)를 계산하시오.</p><div class="equation">\\(A=3x^{3}+2x-1\\)<br>\\(B=2x^{3}-x^{2}-x+1\\)</div><h3>\\(A+B\\)의 계수 입력</h3>${answerFields('sum')}<h3>\\(A-B\\)의 계수 입력</h3>${answerFields('diff')}<div class="tools"><button id="checkBook" class="primary">채점하기</button><button id="hintBtn">단계별 도움 (${state.hints}/3)</button></div><div id="hints"></div><div id="worked"></div><p class="muted">빠진 차수의 계수는 0으로 적습니다. 빈칸은 0으로 처리하지 않습니다.</p>`;}
if(i===4){state.a=[-2,4,-1,2];state.b=[6,-2,2,0];state.op='sub';h=`<h2 id="activityTitle">세 다항식, 괄호부터 살펴보세요</h2><p>교과서 학습을 바탕으로 만든 <strong>심화·변형 문제</strong>입니다.</p><div class="equation">\\(C=2x^{3}-x^{2}+4x-2\\)<br>\\(D=-x^{3}+3x^{2}-2x+5\\)<br>\\(E=x^{3}-x^{2}+1\\)</div><p><strong>\\(C-(D+E)\\)</strong>의 계수를 입력하세요. 무엇을 먼저 계산해야 할까요?</p>${answerFields('challenge')}<h3>수치를 바꾼 변형</h3><p>\\(C\\)의 상수항만 −2에서 0으로 바꾸면 \\(C-(D+E)\\)의 상수항은 얼마일까요?</p><label for="variation">변형 결과의 상수항</label><input id="variation" type="number" inputmode="decimal" step="any"><div class="tools"><button id="checkChallenge" class="primary">두 문제 채점</button><button id="challengeHint">단계별 도움 (${state.challengeHints}/3)</button></div><div id="challengeSupport"></div><div id="challengeWorked"></div><p class="muted">그래프는 \\(C\\)와 괄호 안의 \\(D+E\\)를 표시합니다. 결과는 스스로 계산한 뒤 확인합니다.</p>`;}
if(i===5){resetBase();h=`<h2 id="activityTitle">마지막으로 개념을 정리해요</h2><div class="formula"><h3>동류항끼리 더하기</h3><p>문자와 차수가 같은 항끼리 계수만 더합니다.</p><div class="equation">\\(ax^{n}+bx^{n}=(a+b)x^{n}\\)</div></div><div class="formula"><h3>빼는 식은 모든 항의 부호 바꾸기</h3><div class="equation">\\(A-B=A+(-B)\\)</div><p>괄호 앞의 \\(-\\)는 첫 항에만 붙는 것이 아닙니다.</p></div><div class="formula"><h3>그래프와 식의 역할</h3><p>그래프는 예측하고 확인하는 도구입니다. 계산의 근거는 같은 차수의 계수끼리 더하거나 빼는 데 있습니다.</p></div><label><input type="checkbox" id="reflect"> 빼는 식의 모든 항에 부호를 바꾸는 이유를 설명할 수 있습니다.</label>`;}
if(i===6){let mins=Math.max(1,Math.round((Date.now()-state.start)/60000));h=`<h2 id="activityTitle">오늘의 학습 요약</h2><div class="summary"><p>예측한 계수 <b>${state.prediction}</b></p><p>직접 움직인 계수 <b>${state.moved.size}종</b></p><p>동류항 카드 <b>${Object.keys(state.grouped).length} / 8개</b></p><p>교과서 문제 <b>${state.textbookHelp?'풀이 도움 후 완료':'정답 확인'}</b></p><p>교과서 도움말 <b>${state.hints} / 3장</b></p><p>심화 도움말 <b>${state.challengeHints} / 3장</b></p><p>변형 문제 <b>${state.challengeHelp?'풀이 도움 후 완료':'정답 확인'}</b></p><p>이 화면을 연 시간 <b>약 ${mins}분</b></p></div><div class="notice">이 요약은 현재 화면에만 표시됩니다. 교사나 외부 서비스로 전송하지 않습니다. 시간은 실제 집중 학습 시간을 뜻하지 않습니다.</div><button id="restart" style="margin-top:18px">처음부터 다시</button>`;}
$('activity').innerHTML=h;mjxAll();bind();graph();}
function bind(){let i=state.stage;if(i===0){document.querySelectorAll('[data-pred]').forEach(b=>b.onclick=()=>{state.prediction=Number(b.dataset.pred);state.ok[0]=true;document.querySelectorAll('[data-pred]').forEach(c=>c.style.background=c===b?'#edf5f2':'white');message(state.prediction===1?'예측을 기록했어요. \\(-(-x^{2})=+x^{2}\\)인지 다음 화면에서 확인하세요.':'예측을 기록했어요. 빼는 식의 모든 항을 뒤집으면 어떻게 될지 확인하세요.');$('next').disabled=false;graph();});if(state.prediction!==null)message('예측을 기록했습니다. 다음으로 진행할 수 있습니다.');}
if(i===1){let d=$('degree'),a=$('aCoef'),b=$('bCoef');function relation(){let k=Number(d.value);$('coefRelation').innerHTML=`선택한 항의 계수: \\(${state.a[k]}${state.op==='add'?'+':'-'}(${state.b[k]})=${result()[k]}\\)`;mjxAll();}$('operation').value=state.op;d.onchange=()=>{let k=Number(d.value);state.selK=k;a.value=state.a[k];b.value=state.b[k];$('aval').textContent=a.value;$('bval').textContent=b.value;relation();graph();};a.oninput=b.oninput=e=>{let k=Number(d.value),isA=e.target===a;state[isA?'a':'b'][k]=Number(e.target.value);$(isA?'aval':'bval').textContent=e.target.value;state.moved.add(isA?'A':'B');state.ok[1]=state.moved.size>=2;$('next').disabled=!state.ok[1];relation();graph();};$('operation').onchange=()=>{state.op=$('operation').value;relation();graph()};$('restore').onclick=()=>{resetBase();d.onchange();$('operation').value='sub';relation();message('교과서 식으로 되돌렸습니다.');};relation();}
if(i===2){const cards=BASE_A.map((c,d)=>({id:'A'+d,d,c,label:'\\(A\\)'})).concat(BASE_B.map((c,d)=>({id:'B'+d,d,c:-c,label:'\\(-B\\)'})));function draw(){let used=Object.keys(state.grouped);$('pool').innerHTML=cards.map(c=>`<button class="term ${used.includes(c.id)?'used':''} ${state.selected===c.id?'selected':''}" draggable="true" data-card="${c.id}" ${used.includes(c.id)?'disabled':''}>${c.label}: ${c.c===0?'\\(0x^{'+c.d+'}\\) (자리 표시)':'\\('+format(Array(c.d).fill(0).concat(c.c))+'\\)'}</button>`).join('');$('bins').innerHTML=[3,2,1,0].map(d=>`<button class="bin" data-bin="${d}"><strong>${d===0?'상수항':d===1?'\\(x\\)항':d===2?'\\(x^{2}\\)항':'\\(x^{3}\\)항'}</strong><span>${cards.filter(c=>state.grouped[c.id]===d).map(c=>c.label+': '+c.c).join(' / ')||'이곳에 놓기'}</span></button>`).join('');document.querySelectorAll('[data-card]').forEach(b=>{b.onclick=()=>{state.selected=b.dataset.card;draw()};b.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.dataset.card);state.selected=b.dataset.card;}});document.querySelectorAll('[data-bin]').forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();put(e.dataTransfer.getData('text/plain'),Number(b.dataset.bin))};b.onclick=()=>put(state.selected,Number(b.dataset.bin))});if(used.length===8){state.ok[2]=true;$('next').disabled=false;$('groupResult').innerHTML='\\(A-B=\\)<strong>\\('+format([ -2,3,1,1])+'\\)</strong><br>같은 차수의 계수끼리 묶었습니다.';mjxAll();}else $('groupResult').textContent=`8개 중 ${used.length}개를 묶었습니다.`;mjxAll();}
function put(id,d){if(!id){message('먼저 카드를 선택하세요.',true);return}let card=cards.find(c=>c.id===id);if(!card||state.grouped[id]!==undefined)return;if(card.d!==d){message('문자와 차수가 같은 항인지 다시 확인하세요.',true);return}state.grouped[id]=d;state.selected=null;message('같은 차수의 항을 묶었어요.');draw();}$('resetGroup').onclick=()=>{state.grouped={};state.selected=null;state.ok[2]=false;$('next').disabled=true;draw()};draw();}
if(i===3){function hints(){let hs=['1단계 · 같은 차수끼리 세로로 나란히 적습니다. \\(A\\)에는 \\(x^{2}\\)항이 없으므로 그 계수는 0입니다.','2단계 · \\(A-B\\)에서는 \\(B\\)의 계수 \\(2, -1, -1, 1\\)을 모두 반대로 바꿔 더합니다.','3단계 · 부분 풀이: \\(A-B\\)의 계수는 차례로 \\(3-2,\ 0-(-1),\ 2-(-1),\ -1-1\\)입니다.'];$('hints').innerHTML=hs.slice(0,state.hints).map(t=>'<div class="hint">'+t+'</div>').join('');$('hintBtn').textContent=`단계별 도움 (${state.hints}/3)`;$('hintBtn').disabled=state.hints===3;mjxAll();}$('hintBtn').onclick=()=>{state.hints=Math.min(3,state.hints+1);hints()};hints();$('checkBook').onclick=()=>{state.attempts++;if(same(values('sum'),[0,1,-1,5])&&same(values('diff'),[-2,3,1,1])){state.ok[3]=true;$('next').disabled=false;message('두 연산 모두 맞았습니다. 같은 차수의 계수를 비교했어요.');graph();$('worked').innerHTML='<div class="hint">\\(A+B=5x^{3}-x^{2}+x\\)<br>\\(A-B=x^{3}+x^{2}+3x-2\\)</div>';mjxAll();}else{message('아직 맞지 않는 계수가 있어요. 빠진 항은 0, 뺄셈은 모든 항의 부호를 확인하세요.',true);$('worked').innerHTML='<button id="showWork">전체 풀이 도움 받기</button>';$('showWork').onclick=()=>{state.textbookHelp=true;state.ok[3]=true;$('next').disabled=false;[0,1,2,3].forEach(d=>{$('sum'+d).value=[0,1,-1,5][d];$('diff'+d).value=[-2,3,1,1][d]});$('worked').innerHTML='<div class="hint">더하기: \\((3+2)x^{3}+(0-1)x^{2}+(2-1)x+(-1+1)\\)<br>빼기: \\((3-2)x^{3}+(0+1)x^{2}+(2+1)x+(-1-1)\\)<br>이 완료는 스스로 정답을 맞힌 기록과 구별됩니다.</div>';mjxAll();message('풀이의 각 계수를 입력칸과 비교한 뒤 다음으로 가세요.');graph();};}};if(state.ok[3])message('앞서 완료했습니다. 다시 풀거나 다음으로 진행할 수 있습니다.');}
if(i===4){function showHints(){let hs=['1단계 · 괄호 안의 \\(D+E\\)를 먼저 정리합니다. \\(C-D+E\\)로 괄호를 없애면 \\(E\\)의 부호가 달라져요.','2단계 · \\(D+E=(-1+1)x^{3}+(3-1)x^{2}-2x+(5+1)=2x^{2}-2x+6\\)입니다.','3단계 · 부분 풀이: 결과의 계수는 \\(2-0,\ -1-2,\ 4-(-2),\ -2-6\\)입니다. 변형은 마지막 계산만 \\(0-6\\)으로 바꿉니다.'];$('challengeSupport').innerHTML=hs.slice(0,state.challengeHints).map(t=>'<div class="hint">'+t+'</div>').join('');$('challengeHint').textContent=`단계별 도움 (${state.challengeHints}/3)`;$('challengeHint').disabled=state.challengeHints===3;mjxAll();}$('challengeHint').onclick=()=>{state.challengeHints=Math.min(3,state.challengeHints+1);showHints()};showHints();$('checkChallenge').onclick=()=>{state.challengeAttempts++;let v=$('variation').value;if(same(values('challenge'),[-8,6,-3,2])&&v.trim()!==''&&Number(v)===-6){state.ok[4]=true;$('next').disabled=false;message('맞았습니다. \\(C-(D+E)=2x^{3}-3x^{2}+6x-8\\), 변형의 상수항은 \\(-6\\)입니다.');graph();}else{message('괄호 안을 먼저 정리한 뒤 모든 항의 부호를 바꾸었는지 확인하세요.',true);$('challengeWorked').innerHTML='<button id="challengeWork">전체 풀이 도움 받기</button>';$('challengeWork').onclick=()=>{state.challengeHelp=true;state.ok[4]=true;$('next').disabled=false;[0,1,2,3].forEach(d=>$('challenge'+d).value=[-8,6,-3,2][d]);$('variation').value=-6;$('challengeWorked').innerHTML='<div class="hint">\\(C-(D+E)=2x^{3}+(-1-2)x^{2}+(4+2)x+(-2-6)\\)<br>\\(=2x^{3}-3x^{2}+6x-8\\)<br>변형은 상수항만 \\(0-6=-6\\)으로 바뀝니다.</div>';mjxAll();message('풀이 도움으로 완료했습니다. 괄호를 없앨 때의 부호를 비교하세요.');graph();};}};if(state.ok[4])message('앞서 완료했습니다. 다음으로 진행할 수 있습니다.');}
if(i===5){$('reflect').checked=state.ok[5];$('reflect').onchange=()=>{state.ok[5]=$('reflect').checked;$('next').disabled=!state.ok[5]};}if(i===6)$('restart').onclick=()=>{if(confirm('현재 화면의 학습 기록을 지우고 처음부터 시작할까요?'))location.reload()};}
$('xslider').oninput=()=>{state.x=Number($('xslider').value);graph()};$('back').onclick=()=>{if(state.stage>0){state.stage--;render();window.scrollTo(0,0)}};$('next').onclick=()=>{if(state.ok[state.stage]&&state.stage<6){state.stage++;render();window.scrollTo(0,0)}};render();
</script></body></html>
