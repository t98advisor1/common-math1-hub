<script>

function nice(n){return Math.abs(n)<1e-9?'0':Number(n.toFixed(3)).toString()}
function sup(s){return '<sup>'+s+'</sup>'}
/* polynomial [c0,c1,c2,...] helpers */

 xr=xr||[-3,3];

 yMax=Math.ceil(yMax/5)*5;
 const X=x=>48+(x-xr[0])/(xr[1]-xr[0])*450,Y=y=>302-(y+yMax)/(2*yMax)*280;
 let s='<title id="chartTitle">함수 그래프</title><desc id="chartDesc">함숫값을 비교하는 그래프입니다.</desc><defs><clipPath id="clip"><rect x="48" y="22" width="450" height="280"/></clipPath></defs>';
 for(let v=Math.ceil(xr[0]);v<=xr[1];v++){s+=`<path d="M${X(v)} 22 V302" stroke="#eae9ea"/><text x="${X(v)}" y="322" font-size="13" text-anchor="middle">${v}</text>`;}
 for(let v of [-yMax,-yMax/2,0,yMax/2,yMax]){s+=`<path d="M48 ${Y(v)} H498" stroke="#eae9ea"/><text x="42" y="${Y(v)+4}" font-size="12" text-anchor="end">${nice(v)}</text>`;}
 s+=`<path d="M48 ${Y(0)} H498 M${X(0)} 22 V302" stroke="#938c8f"/><text x="505" y="${Y(0)-5}" font-size="14">x</text><text x="${X(0)+6}" y="18" font-size="14">y</text><g clip-path="url(#clip)">`;
 for(let l of lines){if(l.hide)continue;let d='';for(let i=0;i<=240;i++){let x=xr[0]+i*(xr[1]-xr[0])/240,y=l.f(x);if(!isFinite(y))continue;d+=(d&&!d.endsWith(' ')?'':'')+(i?'L':'M')+X(x).toFixed(2)+' '+Y(Math.max(-yMax*1.2,Math.min(yMax*1.2,y))).toFixed(2)+' ';}
  s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width||2.5}" stroke-dasharray="${l.dash||''}"/><circle cx="${X(state.x)}" cy="${Y(l.f(state.x))}" r="5" fill="${l.color}" stroke="white"/>`;}
 s+=`<path d="M${X(state.x)} 22 V302" stroke="#938c8f" stroke-dasharray="3 5"/></g>`;
 $('graph').innerHTML=s;
 $('legend').innerHTML=lines.filter(l=>!l.hide).map(l=>`<b style="color:${l.color}"><i class="dot" style="border-color:${l.color}"></i>${l.legend||('\\('+l.name+'\\)')}</b>`).join('');
 $('graphText').innerHTML=`\\(x=${nice(state.x)}\\)일 때 `+lines.filter(l=>!l.hide).map(l=>'\\('+l.name+'='+nice(l.f(state.x))+'\\)').join(' / ');
 $('xvalue').textContent=nice(state.x);
 $('graphNote').innerHTML=note||'';
 mjxAll();
}
function frac(n){ /* 0.5 -> 1/2 for display */
 if(Math.abs(n-Math.round(n))<1e-9)return nice(Math.round(n));
 let d=2;while(d<=16&&Math.abs(n*d-Math.round(n*d))>1e-9)d*=2;
 return nice(Math.round(n*d))+'/'+d;
}
function numVal(id){let v=$(id).value.trim();if(v==='')return NaN;v=v.replace('−','-');if(v.includes('/')){let p=v.split('/');return Number(p[0])/Number(p[1]);}return Number(v);}

function sgn(v){return (v<0?'-'+Math.abs(v):'+'+v);}
function termX(c){ /* coefficient of x with 1 suppressed */
 let a=Math.abs(c);let coef=(a===1?'':nice(a));
 return (c<0?'-':'+')+coef+'x';}
function termXhl(c){return (c<0?'':'+')+'\\class{hlj}{'+(c<0?'-':'')+nice(Math.abs(c))+'}x';}
const state={stage:0,ok:[false,false,false,false,false,false,false],x:1,start:Date.now(),
 prediction:null,p:-1,q:2,moved:new Set(),observed:false,

const CARDS=[{id:'m1',label:'(x-1)',a:[-1,1]},{id:'p1',label:'(x+1)',a:[1,1]},{id:'q1',label:'(x^{2}+x+1)',a:[1,1,1]},{id:'q2',label:'(x^{2}-x+1)',a:[1,-1,1]}];

function mul(a,b){let r=Array(a.length+b.length-1).fill(0);for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)r[i+j]+=a[i]*b[j];return r;}
function sameP(a,b){return a.length===b.length&&a.every((v,i)=>Math.abs(v-b[i])<1e-9);}
/* ---------- graph ---------- */
function graph(){
 let lines=[],note='',eq='';
 const i=state.stage;
 if(i===0){
  lines=[{name:'y=x-1',f:x=>x-1,color:'#86705c',dash:'7 4'},{name:'y=x^{2}+x+1',f:x=>x*x+x+1,color:'#585254'}];
  if(state.prediction!==null){lines.push({name:'y=(x-1)(x^{2}+x+1)',f:x=>(x-1)*(x*x+x+1),color:'#377566',width:3.5});eq='<b>\\((x-1)(x^{2}+x+1)=x^{3}-1\\)</b>';}
  else eq='\\((x-1)(x^{2}+x+1)\\)의 곡선은 예측 후에 보여 드립니다.';
  note='두 식의 곡선이 바뀌는 모양을 보고 곱의 개형을 예측해 보세요. 정확한 계수는 식의 전개로 확인합니다.';
 }
 else if(i===1){
  const p=state.p,q=state.q;

  lines=[{name:'y=x'+sp,f:x=>x+p,color:'#86705c',dash:'7 4'},
   {name:'y=x'+sq,f:x=>x+q,color:'#585254',dash:'7 4'},
   {name:'y=(x'+sp+')(x'+sq+')',f:x=>(x+p)*(x+q),color:'#377566',width:3.5}];
  eq='<b>\\((x'+sp+')(x'+sq+')=x^{2}'+termXhl(p+q)+sgn(p*q)+'\\)</b>';
  note='\\(p+q\\)가 0이면 \\(x\\)의 항이 사라집니다: \\((x-a)(x+a)=x^{2}-a^{2}\\).';
 }
 else if(i===2){
  const t=TARGETS[state.round]||TARGETS[1];
  lines=[{name:'y='+t.name,legend:'목표: \\(y='+t.name+'\\)',f:x=>ev(t.a,x),color:'#377566',width:3.5}];
  if(state.combo)lines.push({name:'y='+state.comboLabel,legend:'현재 조합: \\(y='+state.comboLabel+'\\)',f:x=>ev(state.combo,x),color:'#b51f2b',dash:'7 4'});
  eq='목표 식: <b>\\('+t.name+'\\)</b>';
  note='조합한 곡선이 목표 곡선과 정확히 겹치면 성공입니다.';
 }
 else if(i===3){
  const A=[1,-3,-3,2],B=[1,-1,2];
  lines=[{name:'y=2x^{3}-3x^{2}-3x+1',legend:'\\(A\\): \\(y=2x^{3}-3x^{2}-3x+1\\)',f:x=>ev(A,x),color:'#585254'}];
  eq='<b>\\(A=2x^{3}-3x^{2}-3x+1\\)</b><br>\\(B=2x^{2}-x+1\\)';
  if(state.ok[3]){lines.push({name:'y=B \\cdot Q+R',legend:'검산: \\(y=B \\cdot Q+R\\)',f:x=>ev(B,x)*(x-1)+(-5*x+2),color:'#377566',width:3.5,dash:'7 4'});
   eq+='<br><b>확인: \\(A=(2x^{2}-x+1)(x-1)+(-5x+2)\\)</b>';note='두 곡선이 정확히 겹칩니다. 나눗셈의 검산은 \\(A=BQ+R\\)입니다.';}

 }

  if(state.ok[4]){lines.push({name:'y=(x^{2}+1)(x-1)+(2x+3)',f:x=>(x*x+1)*(x-1)+(2*x+3),color:'#377566',width:3.5,dash:'7 4'});
   eq+='<br><b>확인: \\((x^{2}+1)(x-1)+(2x+3)=x^{3}-x^{2}+3x+2\\)</b>';note='\\(A=x^{2}+1\\)을 대입한 식의 곡선이 원래 곡선과 정확히 겹칩니다.';}

 <p class="muted">두 슬라이더를 각각 한 번 이상 움직이고 관찰 미션에 답하면 다음으로 갈 수 있습니다.</p>`;}
 if(i===2){h=`<h2 id="activityTitle">목표 식을 만들어 보세요</h2>

 if(i===3){h=`<h2 id="activityTitle">교과서 문제를 풀어 보세요</h2>
