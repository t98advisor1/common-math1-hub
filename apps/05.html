const state={stage:0,ok:[false,false,false,false,false,false,false],x:1,start:Date.now(),

function graph(){
 let lines=[],note='',eq='';
 const i=state.stage;
 if(i===0){
  lines=[{name:'y = 2x + 6',f:x=>2*x+6,color:'#585254'}];

  eq=`좌변: \\(y=${lin(a,b)}\\)<br>우변: \\(y=2x+6\\)<br>차이: \\(${linhl(a-2,b-6)}\\)`;

 }

 }

 }

 }
